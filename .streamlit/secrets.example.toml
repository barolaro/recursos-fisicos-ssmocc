# Copiar estos valores en el panel Secrets de Streamlit Cloud.
DATABASE_URL = "postgresql+psycopg2://usuario:clave@servidor/basedatos?sslmode=require"
ADMIN_EMAIL = "administrador@gmail.com"
GOOGLE_SHEET_ID = "ID_DE_LA_PLANILLA_PRIVADA"

[gcp_service_account]
type = "service_account"
project_id = "proyecto-google-cloud"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "streamlit-recursos@proyecto-google-cloud.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."

# Inicio de sesión Google para cuentas personales o de organizaciones.
[auth]
redirect_uri = "https://recursos-fisicos-ssmocc.streamlit.app/oauth2callback"
cookie_secret = "generar-un-valor-largo-y-aleatorio"
client_id = "CLIENT_ID_DE_GOOGLE.apps.googleusercontent.com"
client_secret = "CLIENT_SECRET_DE_GOOGLE"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
